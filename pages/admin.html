<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 — 운송B</title>
<link rel="icon" href="https://eeum.bid/brand/favicon/unsong-32.png" sizes="32x32">
<link rel="icon" href="https://eeum.bid/brand/favicon/unsong.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://eeum.bid/brand/favicon/unsong-180.png">
<link rel="stylesheet" href="https://eeum.bid/brand/tokens.css">
<link rel="stylesheet" href="/common.css">
<style>
.page { max-width: 900px; margin: 32px auto; padding: 0 20px; }
.page h1 { font-size: 1.3rem; color: var(--us-ink); margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: #fff; border: 1px solid var(--us-border); border-radius: 10px; padding: 16px; }
.stat .label { font-size: 12px; color: var(--us-muted); }
.stat .value { font-size: 1.5rem; font-weight: 700; color: var(--us-ink); }
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--us-border); margin-bottom: 20px; }
.tabs button {
  background: none; border: none; padding: 10px 16px;
  font-family: inherit; font-size: 13.5px; color: var(--us-muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
}
.tabs button.on { color: var(--us-ink); font-weight: 600; border-bottom-color: var(--us-btn); }
.tab-content { display: none; }
.tab-content.on { display: block; }
.placeholder { text-align: center; padding: 60px 20px; color: var(--us-muted); }
</style>
<script src="https://eeum.bid/brand/login-popup.js" defer></script>
</head>
<body>

<header class="b-head b-wide us">
  <a class="b-eeum" href="https://eeum.bid/" title="이음B 홈페이지로">이음B</a>
  <a class="b-logo" href="/"><span class="b-mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><span class="wm us"><span class="w">운송</span><span class="B">B</span></span><small>unsong.bid</small></a>
  <nav id="nav" class="b-nav"></nav>
  <span id="navTail" class="b-tail"></span>
</header>

<div class="page">
  <h1>운송B 관리자</h1>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <button class="on" data-tab="members">회원</button>
    <button data-tab="shipments">운송</button>
    <button data-tab="settlements">정산</button>
    <button data-tab="settings">설정</button>
  </div>
  <div class="tab-content on" id="tab-members">
    <div class="placeholder">회원 관리 (준비 중)</div>
  </div>
  <div class="tab-content" id="tab-shipments">
    <div class="placeholder">운송 현황 (준비 중)</div>
  </div>
  <div class="tab-content" id="tab-settlements">
    <div class="placeholder">정산 관리 (준비 중)</div>
  </div>
  <div class="tab-content" id="tab-settings">
    <div class="placeholder">요금 설정 (준비 중)</div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/common.js"></script>
<script>
document.getElementById('tabs').addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('on');
});

US.applyNav();

(async function () {
  const user = await US.getUser();
  if (!user) return location.href = '/account';
  const profile = await US.getProfile(user.id);
  if (!profile || profile.role !== 'admin') return location.href = '/';
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="label">전체 회원</div><div class="value">0</div></div>' +
    '<div class="stat"><div class="label">유료 이용 중</div><div class="value">0</div></div>' +
    '<div class="stat"><div class="label">이번 달 운송</div><div class="value">0</div></div>' +
    '<div class="stat"><div class="label">이번 달 정산</div><div class="value">0원</div></div>';
})();
</script>
</body>
</html>
