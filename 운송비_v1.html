<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>운쏭B 시제품</title>
<link rel="stylesheet" href="https://eeum.bid/brand/tokens.css">
<style>
/* tokens.css fallback — CDN 못 받을 때 최소 변수 */
:root{--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--bg:#f4f6f5;--card:#ffffff;--ink:#1f2933;--muted:#7b8794;--line:#d9e2ec}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--card:#181d1b;--ink:#dde5e0;--muted:#8a9e96;--line:#2e3d38}}
:root{
  --us:#4a8a8a; --us-ink:#2d5f6f; --us-soft:#e6f2f0; --us-btn:#3a7575; --us-name:#2d5f6f;
  --surface:var(--card); --surface2:var(--us-soft);
  --accent:var(--us-btn); --accent-ink:#ffffff; --accent-soft:var(--us-soft);
  --mark:var(--us); --mark-soft:var(--us-soft); --ok:#5f7c60; --ok-soft:#edf1e7; --bad:#a14f3d; --bad-soft:#f8ece6;
  --warn:#b5774c; --warn-soft:#f4e9df;
  --f-display:var(--font); --f-body:var(--font); --f-num:"Pretendard Variable",Pretendard,ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#181d1b; --surface2:#1e2926; --ink:#dde5e0; --muted:#8a9e96; --line:#2e3d38;
  --accent:#6ab8a8; --accent-ink:#111614; --accent-soft:#1e3530;
  --mark:#6ab8a8; --mark-soft:#1e3530; --ok:#7fab80; --ok-soft:#1c2e1d; --bad:#e08070; --bad-soft:#3c1e1b;
  --warn:#d4a754; --warn-soft:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#181d1b; --surface2:#1e2926; --ink:#dde5e0; --muted:#8a9e96; --line:#2e3d38;
  --accent:#6ab8a8; --accent-ink:#111614; --accent-soft:#1e3530;
  --mark:#6ab8a8; --mark-soft:#1e3530; --ok:#7fab80; --ok-soft:#1c2e1d; --bad:#e08070; --bad-soft:#3c1e1b;
  --warn:#d4a754; --warn-soft:#3a3018; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{overscroll-behavior-x:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0);z-index:10;background:var(--surface);pointer-events:none}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header.top{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:24px;letter-spacing:.02em;line-height:1}
.logo .w{color:var(--us-name)}
.logo small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:.06em}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;min-width:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:-11px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-num);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:16px;font-weight:500;margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.mark{background:var(--mark-soft);color:var(--mark);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,.seg button:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
form.f .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--surface2);color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body)}
tr.tot td{font-weight:700;background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.note{font-size:13px;color:var(--muted);margin:0}
.warn-box{font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;margin:0}
.empty-s{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet.open{display:flex}
.sheet .card{width:100%;max-width:560px;max-height:80vh;overflow-y:auto}
.sheet .search-wrap{position:sticky;top:0;background:var(--bg);padding:0 0 8px;z-index:1}
.sheet .search-wrap input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--surface2);color:var(--ink)}
.sheet .search-wrap input:focus{outline:none;border-color:var(--accent)}
.sheet .site-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s}
.sheet .site-item:hover,.sheet .site-item:active{background:var(--accent-soft)}
.sheet .site-item .ico{flex:0 0 24px;color:var(--accent)}
.site-pick-btn{display:flex;align-items:center;gap:6px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
.site-pick-btn:hover{border-color:var(--accent)}
.site-pick-btn .ico{flex:0 0 20px;color:var(--muted)}
.site-pick-btn .ico svg{width:16px;height:16px}
.site-pick-btn .pick-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-pick-btn .pick-name.empty{color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* 운송 단계 진행 바 */
.stage-bar{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.stage-bar .st{flex:1;min-width:0;text-align:center;padding:6px 4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);border-right:1px solid var(--line);white-space:nowrap;position:relative;display:flex;align-items:center;justify-content:center;gap:2px}
.stage-bar .ico svg{width:12px;height:12px}
.stage-bar .st:first-child{border-radius:8px 0 0 8px}
.stage-bar .st:last-child{border-radius:0 8px 8px 0;border-right:0}
.stage-bar .st.done{background:var(--ok-soft);color:var(--ok)}
.stage-bar .st.cur{background:var(--accent);color:var(--accent-ink)}
.stage-bar .st.issue{background:var(--bad-soft);color:var(--bad)}
/* 차량 선택 · 3D 적재함 */
.veh-pick-btn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--ink);cursor:pointer;text-align:left;margin-bottom:10px;transition:border-color .15s}
.veh-pick-btn:hover{border-color:var(--accent)}
.veh-pick-btn .vp-label{flex:1}
.veh-pick-btn .vp-arrow{color:var(--ink2);font-size:11px}
.veh-pick-btn.has-veh{border-color:var(--accent);background:var(--accent-soft)}
.veh-pick-btn.has-veh .vp-sub{font-size:12px;color:var(--ink2);margin-top:2px}
.veh-popup-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;align-items:center;justify-content:center}
.veh-popup-bg.open{display:flex}
.veh-popup{background:var(--surface);border-radius:14px;width:92%;max-width:420px;max-height:80vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:20px}
.veh-popup h3{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--ink)}
.veh-popup select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--ink);appearance:auto;cursor:pointer;margin-bottom:12px}
.veh-popup select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.veh-popup .veh-detail{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:14px;padding:10px 12px;background:var(--surface2);border-radius:8px}
.veh-popup .veh-detail b{color:var(--ink);font-weight:600}
.veh-popup .vp-actions{display:flex;gap:8px;justify-content:flex-end}
.veh-popup .vp-actions button{padding:9px 20px;border-radius:8px;font-size:14px;border:none;cursor:pointer}
.veh-popup .vp-actions .btn-cancel{background:var(--surface2);color:var(--ink2)}
.veh-popup .vp-actions .btn-ok{background:var(--accent);color:#fff;font-weight:600}
#cargo3d{width:100%;height:340px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:hidden}
#cargo3d canvas{border-radius:10px;display:block}
.cargo-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:13px}
.cargo-info .ci{background:var(--surface2);border-radius:8px;padding:8px;text-align:center}
.cargo-info .ci b{display:block;font-family:var(--f-num);font-size:16px}
.cargo-info .ci.over b{color:var(--bad)}
/* 지도 (시제품 = 가상) */
.map-box{width:100%;height:220px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.map-box canvas{width:100%;height:100%;border-radius:10px}
.map-label{position:absolute;bottom:8px;left:8px;font-size:11px;background:var(--surface);padding:3px 8px;border-radius:6px;color:var(--muted)}
/* 채팅 */
.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px 0}
.chat .msg{display:flex;flex-direction:column;gap:2px;max-width:82%}
.chat .msg.me{align-self:flex-end;align-items:flex-end}
.chat .msg .who{font-size:11px;font-weight:600;color:var(--muted)}
.chat .msg .bubble{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.45;word-break:break-word}
.chat .msg.me .bubble{background:var(--accent);color:var(--accent-ink)}
.chat .msg .time{font-size:10px;color:var(--muted)}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1}
.chat-input button{flex-shrink:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
[data-act]{-webkit-tap-highlight-color:rgba(74,138,138,.2);touch-action:manipulation}
.item[data-act]{cursor:pointer}
.ico{display:inline-flex;align-items:center;vertical-align:middle;flex-shrink:0}
.ico svg{width:18px;height:18px;stroke-width:1.6}
.seg .ico svg{width:15px;height:15px}
nav.tabs .ico svg{width:15px;height:15px}
.btn .ico svg{width:16px;height:16px}
h2 .ico svg{width:18px;height:18px;color:var(--accent)}
.stat .ico svg{width:16px;height:16px;color:var(--muted)}
/* 업종 선택 오버레이 */
.type-overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.type-pick{max-width:420px;width:100%}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.type-card:hover,.type-card:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.type-card .ico svg{width:32px;height:32px}
.type-card b{font-size:16px}
.type-desc{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
/* 업종/역할 세그먼트 */
.type-seg{min-width:0}
.sub-seg{margin-top:-4px}
.btn-icon{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:flex;align-items:center}
.btn-icon:hover{background:var(--surface2);color:var(--ink)}
.btn-icon .ico svg{width:18px;height:18px}
/* 현재 업종 라벨 */
.type-label{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
/* 소셜 로그인 */
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:1100;display:flex;align-items:center;justify-content:center}
.login-box{width:min(380px,90vw);text-align:center}
.login-box .logo{font-size:36px;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:14px;margin:0 0 28px}
.login-btns{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.login-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,box-shadow .15s}
.login-btn:hover{opacity:.88;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.login-btn svg{flex-shrink:0}
.login-btn.kakao{background:#FEE500;color:#191919}
.login-btn.naver{background:#03C75A;color:#fff}
.login-btn.google{background:#fff;color:#333;border:1.5px solid var(--line)}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.login-skip{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--muted);cursor:pointer;width:100%;transition:background .15s}
.login-skip:hover{background:var(--surface2)}
.login-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.login-user .avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.login-user .avatar.kakao{background:#FEE500;color:#191919}
.login-user .avatar.naver{background:#03C75A}
.login-user .avatar.google{background:#4285F4}
@media(max-width:560px){.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.big{font-size:28px}form.f{grid-template-columns:1fr}.seg button{padding:6px 6px;font-size:12px}.type-cards{grid-template-columns:1fr!important}}
</style>
</head><body ontouchstart="">

</header>

      <button class="login-btn kakao" data-act="socialLogin" data-v="kakao">
        <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 2C5.477 2 1 5.463 1 9.714c0 2.772 1.86 5.202 4.656 6.564-.152.566-.978 3.642-.998 3.78 0 0-.02.166.088.23.108.063.235.014.235.014.31-.043 3.588-2.342 4.154-2.74.586.084 1.19.128 1.806.128C16.523 17.69 21 14.227 21 9.714 21 5.463 16.523 2 11 2" fill="#191919"/></svg>
        카카오 로그인

        <svg width="22" height="22" viewBox="0 0 22 22"><path d="M14.37 3v8.168L7.63 3H2v16h5.63v-8.168L14.37 19H20V3h-5.63z" fill="#fff"/></svg>
        네이버 로그인

function stageBar(status){
  const idx=STAGES.indexOf(status);
  const isIssue=status==='issue'||status==='cancelled';
  return '<div class="stage-bar">'+STAGES.map((s,i)=>{
    let cls='';
    if(isIssue&&s===status) cls='issue';
    else if(i<idx) cls='done';
    else if(i===idx) cls='cur';
    return `<div class="st ${cls}">${ico(STAGE_ICO[s]||'circle')} ${STAGE_KO[s]}</div>`;
  }).join('')+'</div>';
}
function stChip(s){
  const m={requested:'warn',accepted:'acc',loading:'mark',departed:'mark',arrived:'acc',unloaded:'ok',settled:'ok',cancelled:'bad',issue:'bad'};
  return `<span class="chip ${m[s]||''}">${STAGE_KO[s]||s}</span>`;
}

    var done=g.items.filter(s=>s.status==='settled').length;
    var msType=(g.ms&&g.ms.type)||'site';
    var typeChip=g.ms&&g.ms.id?`<span style="display:inline-block;font-size:10px;padding:1px 5px;border-radius:6px;margin-left:4px;vertical-align:middle;background:${msType==='producer'?'var(--accent-soft)':'#e8e0f0'};color:${msType==='producer'?'var(--accent)':'#7c5ea0'}">${msType==='producer'?'생산지':'현장'}</span>`:'';
    return `<details open style="margin-bottom:8px">
      <summary style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)">
        <span style="flex:1;font-weight:600;font-size:14px">${h(g.name)}${typeChip}</span>
        <span style="font-size:12px;color:var(--muted)">${active?'진행 '+active+' · ':''}${g.items.length}건 · ${won(g.totalFare)}원</span>
      </summary>
      <div class="list" style="margin-top:4px">${g.items.map(shipItem).join('')}</div>
    </details>`;
  }).join('');
  return `<section class="card"><h2>${ico('clock')} 운송 내역</h2>${segHtml}${subSeg}
    ${body}${!gKeys.length?'<div class="empty-s">운송 내역이 없습니다.</div>':''}</section>`;
}

function billingView(){
  const total=S.shipments.filter(s=>s.payer==='orderer').reduce((a,s)=>a+s.fare,0);
  const comm=Math.round(total*S.rates.commission_rate/100);
  return `
  <section class="card"><h2>${ico('credit-card')} 이달 정산</h2>
    <div class="big">${won(total+comm)}<small>원</small></div>
    <div style="font-size:14px"><span class="lbl">운임</span> ${won(total)}원 + <span class="lbl">수수료 ${S.rates.commission_rate}%</span> ${won(comm)}원</div>
    <div class="chip warn">가정값 — 이음B 설정에서 수정</div>
  </section>
  <section class="card"><h2>${ico('bookmark')} 구독</h2>
    <div style="font-size:14px">화주 월 구독료: <b class="num">${won(S.rates.sub_orderer)}원</b> <span class="chip warn">가정값</span></div>
  </section>`;
}

/* ========== 생산자 ========== */
function vProducer(t){
  if(t==='home'){
    const recv=S.shipments.filter(s=>s.status==='requested');
    const active=S.shipments.filter(s=>['accepted','loading'].includes(s.status));
    return `
    ${typeBanner()}
    <section class="stats">
      <div class="stat"><span class="lbl">${ico('inbox')} 새 요청</span><b>${recv.length}</b></div>
      <div class="stat"><span class="lbl">${ico('package')} 출하 대기</span><b>${active.length}</b></div>
      <div class="stat"><span class="lbl">${ico('truck')} 이달 출하</span><b>${S.shipments.filter(s=>s.loadingAt).length}</b></div>
    </section>
    ${recv.length?`<section class="card"><h2>${ico('inbox')} 받은 요청</h2><div class="list">${recv.map(s=>`
      <div class="item"><div class="grow"><div class="t">${h(s.cargoType||itemsSummary(s.items))}</div><div class="s">→ ${h(MS(s.toSite).name||ST(s.site).name||'')} · 약 ${won(s.approxKg||itemsWeight(s.items))}kg</div></div>
      <button class="btn sm pri" data-act="accept" data-v="${s.id}">${ico('check')} 접수</button></div>`).join('')}</div></section>`:''}
    ${active.length?`<section class="card"><h2>${ico('package')} 출하 준비</h2><div class="list">${active.map(s=>`
      <div class="item"><div class="grow"><div class="t">${h(s.cargoType||itemsSummary(s.items))}</div></div>${stChip(s.status)}</div>`).join('')}</div></section>`:''}`;
  }
  if(t==='received'){
    return `<section class="card"><h2>${ico('list')} 받은 요청 전체</h2><div class="list">${S.shipments.map(s=>`
      <div class="item"><div class="grow"><div class="t">${h(s.cargoType||itemsSummary(s.items))}</div>
      <div class="s">${h(MS(s.fromSite).name||s.orderer)} → ${h(MS(s.toSite).name||ST(s.site).name||'')} · ${h((s.requestedAt||'').slice(0,10))}</div></div>
      ${stChip(s.status)}${s.status==='requested'?`<button class="btn sm pri" data-act="accept" data-v="${s.id}">${ico('check')} 접수</button>`:''}</div>`).join('')}</div></section>`;
  }
  if(t==='ship'){
    const ready=S.shipments.filter(s=>s.status==='accepted');
    return `<section class="card"><h2>${ico('clipboard-list')} 출하 등록</h2>
      ${ready.length?`<div class="list">${ready.map(s=>`<div class="item"><div class="grow">
        <div class="t">${h(s.cargoType||itemsSummary(s.items))}</div><div class="s">약 ${won(s.approxKg||itemsWeight(s.items))}kg · ${h(MS(s.toSite).name||ST(s.site).name||'')}</div></div>
        <button class="btn sm pri" data-act="startLoad" data-v="${s.id}">${ico('loader')} 상차 시작</button></div>`).join('')}</div>`:'<div class="empty-s">출하 대기 건이 없습니다.</div>'}
      <p class="note">상차 사진은 서버 버전에서 촬영합니다.</p>
    </section>`;
  }
  if(t==='tracking') return trackingView();
  if(t==='invoice'){
    const done=S.shipments.filter(s=>['unloaded','settled'].includes(s.status));
    return `<section class="card"><h2>${ico('file-text')} 납품서 발행</h2>
      ${done.length?`<div class="list">${done.map(s=>`<div class="item"><div class="grow">
        <div class="t">${h(s.cargoType||itemsSummary(s.items))}</div><div class="s">${h(MS(s.toSite).name||ST(s.site).name||'')} · ${h((s.unloadedAt||'').slice(0,10))}</div></div>
        <button class="btn sm" data-act="toast" data-v="납품서 발행 (서버 버전)">${ico('file-text')} 납품서</button></div>`).join('')}</div>`:'<div class="empty-s">완료된 운송이 없습니다.</div>'}
    </section>`;
  }
}

/* ========== 현장 ========== */
function vSite(t){
  const mySite=S.sites[0];
  if(t==='home'){
    const incoming=S.shipments.filter(s=>['departed','arrived'].includes(s.status));
    const toReceive=S.shipments.filter(s=>s.status==='arrived');
    return `
    ${typeBanner()}
    <section class="stats">
      <div class="stat"><span class="lbl">${ico('navigation')} 도착 예정</span><b>${incoming.length}</b></div>
      <div class="stat"><span class="lbl">${ico('clipboard-check')} 인수 대기</span><b>${toReceive.length}</b></div>
      <div class="stat"><span class="lbl">${ico('check-circle')} 이달 인수</span><b>${S.shipments.filter(s=>s.unloadedAt).length}</b></div>
    </section>
    ${incoming.length?`<section class="card"><h2>${ico('navigation')} 도착 예정</h2><div class="list">${incoming.map(s=>`
      <div class="item"><div class="grow"><div class="t">${h(s.cargoType||itemsSummary(s.items))}</div>
      <div class="s">${h(MS(s.fromSite).name||PD(s.producer).name||s.producer)} · ${h(DR(s.driver).name||'배차 대기')}${s.eta?' · 예정 '+h(s.eta):''}</div></div>${stChip(s.status)}</div>`).join('')}</div></section>`:''}`;
  }
  if(t==='info'){
    return `<section class="card"><h2>${ico('building-2')} ${h(mySite.name)}</h2>
      <form class="f">
        <label>주소<input value="${h(mySite.addr)}" readonly></label>
        <label>반입 시간<input value="${h(mySite.time)}" readonly></label>
        <label>하차 장비<input value="${h(mySite.equip)}" readonly></label>
        <label>담당자<input value="${h(mySite.contact)} ${h(mySite.phone)}" readonly></label>
        <label class="full">출입 경로<input value="${h(mySite.route)}" readonly></label>
        <label class="full">주의사항<textarea readonly rows="2">${h(mySite.notes)}</textarea></label>
      </form>
      <p class="note">서버 버전에서 수정합니다.</p>
    </section>`;
  }
  if(t==='incoming') return trackingView();
  if(t==='receive'){
    const arr=S.shipments.filter(s=>s.status==='arrived'||s.status==='unloaded');
    return `<section class="card"><h2>${ico('check-circle')} 인수 확인</h2>
      ${arr.length?`<div class="list">${arr.map(s=>`<div class="item"><div class="grow">
        <div class="t">${h(s.cargoType||itemsSummary(s.items))}</div><div class="s">${h(MS(s.fromSite).name||PD(s.producer).name||'')} · ${h(DR(s.driver).name||'')}</div></div>
        ${s.status==='arrived'?`<button class="btn sm pri" data-act="confirmRecv" data-v="${s.id}">${ico('check-circle')} 인수 확인</button>`:s.signature?'<span class="chip ok">인수 완료</span>':''}
      </div>`).join('')}</div>`:'<div class="empty-s">인수할 운송이 없습니다.</div>'}
      <p class="note">인수 사진·서명은 서버 버전에서 처리합니다.</p>
    </section>`;
  }
  if(t==='issues'){
    const issues=S.shipments.filter(s=>s.issue);
    return `<section class="card"><h2>${ico('alert-triangle')} 하자/부족 신고</h2>
      ${issues.length?`<div class="list">${issues.map(s=>`<div class="item"><div class="grow"><div class="t">${itemsSummary(s.items)}</div><div class="s">${h(s.issue)}</div></div><span class="chip bad">신고됨</span></div>`).join('')}</div>`:'<div class="empty-s">신고 내역이 없습니다.</div>'}
      <div class="actions"><button class="btn" data-act="toast" data-v="하자 신고 양식 (서버 버전)">${ico('plus-circle')} 새 신고</button></div>
    </section>`;
  }
}

  if(t==='home'){
    const waiting=S.shipments.filter(s=>s.status==='requested'&&!s.driver);
    const mine=S.shipments.filter(s=>s.driver===me.id&&!['settled','cancelled'].includes(s.status));
    return `
    ${typeBanner()}
    ${!me.verified?`<section class="card" style="background:var(--warn-soft);border-color:var(--warn)">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap">${ico('alert-triangle')} <b>서류 확인 중</b> <span style="color:var(--muted)">사업자등록증·차량등록증 확인이 끝나면 배차를 받을 수 있습니다.</span></div>
      <div class="actions"><button class="btn sm" data-act="tab" data-v="profile">${ico('user')} 내 정보 확인</button></div>
    </section>`:`<section class="card" style="background:var(--ok-soft);border-color:var(--ok);padding:10px 16px">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px">${ico('check-circle')} <b>인증 완료</b> <span style="color:var(--muted)">운송 요청을 받을 수 있습니다.</span></div>
    </section>`}
    <section class="stats">
      <div class="stat"><span class="lbl">${ico('bell')} 올라온 건</span><b>${waiting.length}</b></div>
      <div class="stat"><span class="lbl">${ico('navigation')} 진행 중</span><b>${mine.length}</b></div>
      <div class="stat"><span class="lbl">${ico('truck')} 내 차량</span><b>${myV?h(myV.ton+' '+myV.type):'-'}</b></div>
    </section>
    ${waiting.length?`<section class="card"><h2>${ico('bell')} 올라온 운송 요청</h2><div class="list">${waiting.slice(0,3).map(s=>{
      var from=MS(s.fromSite),to=MS(s.toSite);

      <div class="s">${h(from.name||'')} → ${h(to.name||'')} · 운임 ${won(s.fare)}원</div></div>${ico('chevron-right')}</div>`}).join('')}</div>
      ${waiting.length>3?`<div class="actions"><button class="btn sm" data-act="tab" data-v="dispatch">전체 ${waiting.length}건 보기</button></div>`:''}</section>`:''}
    ${mine.length?`<section class="card"><h2>${ico('navigation')} 진행 중</h2><div class="list">${mine.map(s=>`
      <div class="item"><div class="grow"><div class="t">${h(s.cargoType||itemsSummary(s.items))}</div>
      <div class="s">${h(MS(s.fromSite).name||PD(s.producer).name||'')} → ${h(MS(s.toSite).name||ST(s.site).name||'')}</div></div>
      ${stChip(s.status)}${nextAction(s)}</div>`).join('')}</div></section>`:''}`;
  }
  if(t==='dispatch'){
    const waiting=S.shipments.filter(s=>s.status==='requested'&&!s.driver);
    return `<section class="card"><h2>${ico('bell')} 올라온 운송 요청 <span class="chip acc">${waiting.length}건</span></h2>
      <p class="note">운송 요청이 올라오면 여기에 표시됩니다. 원하는 건을 골라 수락하세요.</p>
      ${!me.verified?'<div class="warn-box">서류 확인이 완료되지 않아 수락할 수 없습니다. 내 정보에서 서류를 제출해 주세요.</div>':''}
      ${waiting.length?waiting.map(s=>{
        var from=MS(s.fromSite),to=MS(s.toSite);var veh=s.vehicleId?V(s.vehicleId):null;
        return `<div class="card" style="gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><div class="t">${h(s.cargoType||itemsSummary(s.items))} · 약 ${won(s.approxKg||0)}kg</div><span class="chip warn">대기</span></div>
          <div class="split">
            <div><span class="lbl">출발지</span><div>${h(from.name||PD(s.producer).addr||'')}</div><div class="s">${h(from.addr||'')}</div></div>
            <div><span class="lbl">도착지</span><div>${h(to.name||ST(s.site).name||'')}</div><div class="s">${h(to.addr||'')}</div></div>
          </div>
          <div class="split">
            <div><span class="lbl">상차</span> ${h(s.loadTime||'-')}</div>
            <div><span class="lbl">하차</span> ${h(s.unloadTime||'-')}</div>
          </div>
          ${veh?`<div><span class="lbl">요청 차량</span> ${veh.ton} ${veh.type}</div>`:''}
          <div><span class="lbl">운임</span> <b class="num">${won(s.fare)}원</b> <span class="chip warn">${h(s.fareNote)}</span></div>
          <div style="border-top:1px solid var(--line);padding-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)">도착 예정 <input type="time" id="eta_${s.id}" style="width:110px"></label>
            <button class="btn sm pri" data-act="driverAccept" data-v="${s.id}" ${!me.verified?'disabled':''}>${ico('check')} 내가 가겠습니다</button>
          </div>
        </div>`}).join(''):'<div class="empty-s">올라온 운송 요청이 없습니다.</div>'}
    </section>`;
  }
  if(t==='driving'){
    const mine=S.shipments.filter(s=>s.driver===me.id&&!['settled','cancelled','requested'].includes(s.status));
    return `<section class="card"><h2>${ico('navigation')} 운송 진행</h2>

      </div>`}).join(''):'<div class="empty-s">진행 중인 운송이 없습니다.</div>'}

    return `<section class="card"><h2>${ico('truck')} 내 차량</h2>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
        <div><span class="lbl">차량번호</span> ${h(me.plateNo)}</div>

        <div><span class="lbl">최대적재량</span> ${myV?won(myV.maxKg)+'kg':'확인 필요'}</div>

    <section class="card"><h2>${ico('box')} 적재함 3D</h2><div id="cargo3d"></div></section>`;

    return `

      <form class="f" data-form="saveVehicle">

        <label>차종<select name="vehicleId">${S.vehicles.map(v=>`<option value="${v.id}" ${v.id===me.vehicleId?'selected':''}>${v.ton} ${v.type} — ${h(v.name)}${v.confirmed?'':' (확인 필요)'}</option>`).join('')}</select></label>
        <label>적재함 길이(mm)<input name="actualL" type="number" value="${me.actualL}"></label>
        <label>적재함 폭(mm)<input name="actualW" type="number" value="${me.actualW}"></label>
        <label>적재함 높이(mm)<input name="actualH" type="number" value="${me.actualH}"></label>

        <div class="item"><div class="grow"><div class="t">화물배상책임보험</div><div class="s">${me.insuranceDoc?h(me.insuranceDoc):'미제출'}</div></div>${me.insuranceDoc?'<span class="chip ok">제출됨</span>':'<span class="chip bad">미제출</span>'}</div>
        <div class="item"><div class="grow"><div class="t">화물운송종사자격증</div><div class="s">선택 제출</div></div><span class="chip">선택</span></div>

/* ========== 3D 적재함 (Canvas 2D 등각 뷰어 — CDN 없이 작동) ========== */
let cargo3dScene;
function render3D(containerId,vehicleId,items){
  var el=document.getElementById(containerId);if(!el)return;
  el.innerHTML='';
  var veh=V(vehicleId);if(!veh||!veh.id)return;
  var cvs=document.createElement('canvas');
  cvs.style.cssText='width:100%;height:100%;border-radius:10px;cursor:grab;touch-action:none';
  el.appendChild(cvs);
  var ctx=cvs.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);

  var theta=-0.52, phi=0.45, zm=1;
  var drag=false, lx=0, ly=0, pinch=0;
  var L=veh.L, W=veh.W, H=veh.H||400;
  var ton=parseFloat(veh.ton)||1;
  var wR=Math.min(520,Math.max(260,200+ton*14));
  var fH=100,tgap=50+L*0.015;
  var cabL=Math.min(W*0.85,Math.max(1000,L*0.35+ton*20));
  var cabH=Math.max(H+300,1600);var cabW=W*0.9;var tireW=wR*0.35;
  var fullTL=L+tgap+cabL;var fullTH=Math.max(H,cabH)+fH+wR*2;
  var maxD=Math.max(fullTL,W*1.3,fullTH);
  var dimOff=maxD*0.08;
  var vcx=-(tgap+cabL)/2, vcy=-(fH+wR)/3;

  function sz(){var r=el.getBoundingClientRect();cvs.width=r.width*dpr;cvs.height=r.height*dpr}

  function pj(x,y,z){
    x-=vcx;y-=vcy;
    var ct=Math.cos(theta),st=Math.sin(theta),cp=Math.cos(phi),sp=Math.sin(phi);
    var rx=x*ct-z*st, rz=x*st+z*ct;
    var ry=y*cp-rz*sp, rz2=y*sp+rz*cp;
    var cw=cvs.width/dpr, ch=cvs.height/dpr;
    var sc=zm*Math.min(cw,ch)/(maxD*2.8);
    return {x:cw/2+rx*sc, y:ch/2-ry*sc, d:rz2}
  }

  function ln(x1,y1,z1,x2,y2,z2,col,w){
    var a=pj(x1,y1,z1),b=pj(x2,y2,z2);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=col;ctx.lineWidth=w||1;ctx.stroke()
  }

  function face(pts,fill,alpha){
    if(pts.length<3)return;
    ctx.globalAlpha=alpha||1;ctx.beginPath();
    pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.globalAlpha=1
  }

  function box(cx,cy,cz,sx,sy,sz,fill,stroke,alpha){
    var hx=sx/2,hy=sy/2,hz=sz/2;
    var c=[
      pj(cx-hx,cy-hy,cz-hz),pj(cx+hx,cy-hy,cz-hz),
      pj(cx+hx,cy+hy,cz-hz),pj(cx-hx,cy+hy,cz-hz),
      pj(cx-hx,cy-hy,cz+hz),pj(cx+hx,cy-hy,cz+hz),
      pj(cx+hx,cy+hy,cz+hz),pj(cx-hx,cy+hy,cz+hz)
    ];
    var faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[0,3,7,4],[1,2,6,5]];
    var sf=faces.map(function(f){return{i:f,z:(c[f[0]].d+c[f[1]].d+c[f[2]].d+c[f[3]].d)/4}}).sort(function(a,b){return a.z-b.z});
    if(fill){sf.forEach(function(fc){face([c[fc.i[0]],c[fc.i[1]],c[fc.i[2]],c[fc.i[3]]],fill,alpha||0.65)})}
    var edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    edges.forEach(function(e){
      ctx.beginPath();ctx.moveTo(c[e[0]].x,c[e[0]].y);ctx.lineTo(c[e[1]].x,c[e[1]].y);
      ctx.strokeStyle=stroke||'#1f2933';ctx.lineWidth=1;ctx.stroke()
    })
  }

  function arrow(ax,ay,bx,by,col){
    var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy);
    if(len<6)return;
    var ux=dx/len,uy=dy/len,sz=5;
    ctx.beginPath();
    ctx.moveTo(bx,by);ctx.lineTo(bx-ux*sz+uy*sz*0.4,by-uy*sz-ux*sz*0.4);
    ctx.moveTo(bx,by);ctx.lineTo(bx-ux*sz-uy*sz*0.4,by-uy*sz+ux*sz*0.4);
    ctx.moveTo(ax,ay);ctx.lineTo(ax+ux*sz-uy*sz*0.4,ay+uy*sz+ux*sz*0.4);
    ctx.moveTo(ax,ay);ctx.lineTo(ax+ux*sz+uy*sz*0.4,ay+uy*sz-ux*sz*0.4);
    ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke()
  }

  function dim(x1,y1,z1,x2,y2,z2,label,col){
    var a=pj(x1,y1,z1),b=pj(x2,y2,z2);
    var c=col||'#a14f3d';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
    arrow(a.x,a.y,b.x,b.y,c);
    var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    var dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#1');
    ctx.font='bold 11px sans-serif';
    var tw=ctx.measureText(label).width;
    ctx.fillStyle=dark?'rgba(30,41,38,0.85)':'rgba(255,255,255,0.85)';
    ctx.fillRect(mx-tw/2-4,my-8,tw+8,16);
    ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,mx,my)
  }

  function draw(){
    sz();
    var cw=cvs.width/dpr, ch=cvs.height/dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#1');
    ctx.fillStyle=dark?'#1e2926':'#e6f2f0';
    ctx.fillRect(0,0,cw,ch);

    var gridC=dark?'rgba(74,138,138,0.15)':'rgba(74,138,138,0.12)';
    var step=Math.max(200,Math.round(maxD/10/100)*100);
    var gxMin=-L/2-tgap-cabL-200,gxMax=L/2+200;
    for(var gx=gxMin;gx<=gxMax;gx+=step){ln(gx,0,-W/2,gx,0,W/2,gridC,0.5)}
    for(var gz=-W/2;gz<=W/2;gz+=step){ln(gxMin,0,gz,gxMax,0,gz,gridC,0.5)}

    var wheelCY=-fH;
    var cabCx=-L/2-tgap-cabL/2;
    var frameFr=-L/2-tgap-cabL*0.7,frameRr=L/2+L*0.04;

    box((frameFr+frameRr)/2,-fH/2,0,frameRr-frameFr,fH,W*0.45,
      dark?'#2a3530':'#5a6a65',dark?'#3a4540':'#4a5a55',0.7);

    box(cabCx,cabH/2,0,cabL,cabH,cabW,
      dark?'#2d4845':'#c5d8d3',dark?'#3a5a55':'#8a9e98',0.75);

    var wsFr=-L/2-tgap-cabL;
    face([pj(wsFr,cabH*0.3,cabW*0.42),pj(wsFr,cabH*0.88,cabW*0.35),
          pj(wsFr,cabH*0.88,-cabW*0.35),pj(wsFr,cabH*0.3,-cabW*0.42)],
      dark?'rgba(100,160,180,0.25)':'rgba(180,220,240,0.45)',1);

    var dw=function(wx,wy,wz){
      var c=pj(wx,wy,wz),t=pj(wx,wy+wR,wz);
      var pr=Math.max(6,Math.abs(c.y-t.y));
      ctx.beginPath();ctx.arc(c.x,c.y,pr,0,Math.PI*2);
      ctx.fillStyle='#2a2a2a';ctx.fill();
      ctx.strokeStyle=dark?'#555':'#444';ctx.lineWidth=1.5;ctx.stroke();
      ctx.beginPath();ctx.arc(c.x,c.y,pr*0.5,0,Math.PI*2);
      ctx.fillStyle=dark?'#555':'#999';ctx.fill();
      ctx.strokeStyle=dark?'#444':'#777';ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.arc(c.x,c.y,pr*0.15,0,Math.PI*2);
      ctx.fillStyle=dark?'#333':'#666';ctx.fill()
    };
    var fAx=cabCx,rAx=L*0.15,tw2=tireW;
    dw(fAx,wheelCY,W/2+tw2);dw(fAx,wheelCY,-W/2-tw2);
    dw(rAx,wheelCY,W/2+tw2);dw(rAx,wheelCY,-W/2-tw2);
    if(ton>4){dw(rAx,wheelCY,W/2+tw2*2.8);dw(rAx,wheelCY,-W/2-tw2*2.8)}
    if(ton>10){var rAx2=rAx-wR*2.2;
      dw(rAx2,wheelCY,W/2+tw2);dw(rAx2,wheelCY,-W/2-tw2);
      dw(rAx2,wheelCY,W/2+tw2*2.8);dw(rAx2,wheelCY,-W/2-tw2*2.8)}

    box(0,H/2,0,L,H,W,null,dark?'rgba(106,184,168,0.45)':'rgba(74,138,138,0.4)');

    face([pj(-L/2,0,-W/2),pj(L/2,0,-W/2),pj(L/2,0,W/2),pj(-L/2,0,W/2)],
      dark?'rgba(74,138,138,0.08)':'rgba(74,138,138,0.06)',1);

    var totalKg=0,overL=false,overH=false,overW=false;
    if(items&&items.length){
      var xOff=-L/2+50;
      var colors=['#b5774c','#7f9a7e','#6e8193'];
      items.forEach(function(it,i){
        var iL=it.L||500,iW=it.W||200,iH=it.H||100;
        totalKg+=it.qty*(it.unitKg||0);
        if(iL>L)overL=true;
        if(iW>W)overW=true;
        var stackH=Math.ceil(it.qty/Math.max(1,Math.floor(W/iW)));
        if(stackH*iH>(veh.H||9999))overH=true;
        box(xOff+iL/2,iH/2,0,iL,iH,iW,colors[i%3],'#1f2933',0.65);

        var cp=pj(xOff+iL/2,iH+30,0);
        ctx.font='10px sans-serif';ctx.fillStyle=dark?'#dde5e0':'#1f2933';
        ctx.textAlign='center';ctx.textBaseline='bottom';
        ctx.fillText(it.name||'품목'+(i+1),cp.x,cp.y);
        xOff+=iL+100
      })
    }
    var overKg=totalKg>veh.maxKg;

    dim(-L/2,0,W/2+dimOff,L/2,0,W/2+dimOff,won(L)+'mm','#a14f3d');
    dim(-L/2-dimOff,0,W/2,-L/2-dimOff,0,-W/2,won(W)+'mm','#a14f3d');
    if(H>100) dim(L/2+dimOff,0,-W/2+dimOff*0.3,L/2+dimOff,H,-W/2+dimOff*0.3,won(H)+'mm','#a14f3d');

    ctx.font='11px sans-serif';ctx.fillStyle=dark?'#8a9e96':'#7b8794';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('드래그: 회전 · 휠/핀치: 확대·축소',cw/2,ch-6);

    var infoEl=document.getElementById('cargoInfo');
    if(infoEl){
      infoEl.innerHTML=
        '<div class="ci '+(overL?'over':'')+'"><span class="lbl">길이</span><b>'+won(L)+'mm</b></div>'+
        '<div class="ci '+(overW?'over':'')+'"><span class="lbl">폭</span><b>'+won(W)+'mm</b></div>'+
        '<div class="ci"><span class="lbl">높이</span><b>'+(H>100?won(H)+'mm':'확인 필요')+'</b></div>'+
        '<div class="ci '+(overKg?'over':'')+'"><span class="lbl">적재량</span><b>'+won(veh.maxKg)+'kg</b></div>'+
        '<div class="ci"><span class="lbl">화물 무게</span><b>'+won(totalKg)+'kg</b></div>'+
        '<div class="ci">'+(overL||overH||overW||overKg?'<b style="color:var(--bad)">초과!</b>':'<b style="color:var(--ok)">적재 가능</b>')+'</div>'
    }
  }

  cvs.addEventListener('mousedown',function(e){drag=true;lx=e.clientX;ly=e.clientY;cvs.style.cursor='grabbing'});
  window.addEventListener('mousemove',function(e){
    if(!drag)return;
    theta+=(e.clientX-lx)*0.008;
    phi=Math.max(-1.2,Math.min(1.2,phi+(e.clientY-ly)*0.008));
    lx=e.clientX;ly=e.clientY;draw()
  });
  window.addEventListener('mouseup',function(){drag=false;cvs.style.cursor='grab'});

  cvs.addEventListener('wheel',function(e){
    e.preventDefault();
    zm=Math.max(0.3,Math.min(5,zm*(1-e.deltaY*0.001)));draw()
  },{passive:false});

  cvs.addEventListener('touchstart',function(e){
    if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY}
    else if(e.touches.length===2){pinch=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY)}
  });
  cvs.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(e.touches.length===1&&drag){
      theta+=(e.touches[0].clientX-lx)*0.008;
      phi=Math.max(-1.2,Math.min(1.2,phi+(e.touches[0].clientY-ly)*0.008));
      lx=e.touches[0].clientX;ly=e.touches[0].clientY;draw()
    }else if(e.touches.length===2){
      var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      if(pinch>0){zm=Math.max(0.3,Math.min(5,zm*(d/pinch)));pinch=d;draw()}
    }
  },{passive:false});
  cvs.addEventListener('touchend',function(){drag=false;pinch=0});

  draw();
  cargo3dScene={draw:draw,el:el}
}

/* 가상 지도 (캔버스) */
function drawMap(canvasId,gps,from,to){
  const c=document.getElementById(canvasId);if(!c)return;
  const ctx=c.getContext('2d');
  const w=c.parentElement.clientWidth,hh=c.parentElement.clientHeight||220;
  c.width=w*2;c.height=hh*2;c.style.width=w+'px';c.style.height=hh+'px';
  ctx.scale(2,2);
  const isDark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#1');
  ctx.fillStyle=isDark?'#1e2926':'#e6f2f0';
  ctx.fillRect(0,0,w,hh);

  // 한반도 대략 경계
  const pts=[[126.5,37.7],[127.0,37.6],[127.5,37.3],[128.0,36.5],[129.0,35.5],[128.8,35.1],[127.5,34.8],[126.5,35.0],[126.3,35.5],[126.5,36.5],[126.5,37.7]];
  const minLng=125.5,maxLng=129.5,minLat=34.5,maxLat=38.0;
  const tx=lng=>(lng-minLng)/(maxLng-minLng)*w;
  const ty=lat=>hh-(lat-minLat)/(maxLat-minLat)*hh;

  ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(tx(p[0]),ty(p[1])):ctx.moveTo(tx(p[0]),ty(p[1]))});
  ctx.closePath();
  ctx.fillStyle=isDark?'#253530':'#d5e8e0';ctx.fill();
  ctx.strokeStyle=isDark?'#3a5048':'#8ab8a8';ctx.lineWidth=1.5;ctx.stroke();

  // 경로
  if(gps&&gps.length>1){
    ctx.beginPath();ctx.strokeStyle='#4a8a8a';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    gps.forEach((p,i)=>{i?ctx.lineTo(tx(p.lng),ty(p.lat)):ctx.moveTo(tx(p.lng),ty(p.lat))});
    ctx.stroke();ctx.setLineDash([]);
    // 현재 위치
    const last=gps[gps.length-1];
    ctx.beginPath();ctx.arc(tx(last.lng),ty(last.lat),6,0,Math.PI*2);
    ctx.fillStyle='#4a8a8a';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  }
  // 출발/도착 마커
  if(from){ctx.beginPath();ctx.arc(tx(from.lng),ty(from.lat),5,0,Math.PI*2);ctx.fillStyle='#5f7c60';ctx.fill()}
  if(to){ctx.beginPath();ctx.arc(tx(to.lng),ty(to.lat),5,0,Math.PI*2);ctx.fillStyle='#a14f3d';ctx.fill()}
}

const TABS_FOR={
  orderer:['home','request','tracking','history','billing'],
  producer:['home','received','ship','tracking','invoice'],

    document.body.appendChild(pop);

      if(sh){

function bindActions(){

/* 이벤트 */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;setTimeout(()=>t.hidden=true,2500)}
function handleAction(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  if(e.type==='touchend'){e.preventDefault()}
  const act=b.dataset.act,v=b.dataset.v;
  if(act==='socialLogin'){
    var providerNames={kakao:'카카오',naver:'네이버',google:'Google',guest:'체험'};
    var mockNames={kakao:'김운송',naver:'박화주',google:'Lee Transport',guest:'체험 사용자'};
    UI.login={provider:v,name:mockNames[v]||'사용자',loggedAt:new Date().toISOString()};
    if(v!=='guest') toast(providerNames[v]+' 로그인 완료 (시제품)');
    save();render();return;
  }
  if(act==='logout'){
    UI.login=null;UI.type=null;save();render();return;
  }
  if(act==='pickType'){
    var rObj=ROLES.find(function(x){return x.id===v});
    UI.type=rObj?rObj.type:'shipper';
    UI.role=v;
    pushUI();render();return}
  if(act==='setType'){
    if(v==='operator'){UI.type='admin';UI.role='operator';pushUI();render();return}
    if(v==='share'){UI.type='share';UI.role='share';pushUI();render();return}
    var rObj2=ROLES.find(function(x){return x.id===v});
    if(rObj2){UI.type=rObj2.type;UI.role=v}
    pushUI();render();return}
  if(act==='goHome'){UI.type=null;UI.role='orderer';pushUI();render();return}
  if(act==='role'){UI.role=v;render();return}
  if(act==='tab'){UI.tab[UI.role]=v;render();return}
  if(act==='selTrack'){UI.sel.trackId=v;UI.tab[UI.role]='tracking';render();return}
  if(act==='detail'){UI.sel.trackId=v;UI.tab[UI.role]='tracking';render();return}
  if(act==='histMode'){UI.sel._histMode=v;render();return}
  if(act==='histSiteFilter'){UI.sel._histSiteFilter=v;render();return}
  if(act==='openVehPopup'){openVehPopup();return}
  if(act==='pickVeh'){return}
  if(act==='toast'){toast(v);return}
  if(act==='reset'){if(confirm('예시 데이터를 초기화할까요?')){localStorage.removeItem(KEY);sessionStorage.removeItem(KEY+'_ui');S=seed();UI={type:null,role:'orderer',tab:{orderer:'home',producer:'home',site:'home',driver:'home',operator:'home',share:'track'},sel:{},login:null};save();render();toast('초기화 완료')}return}
  // 현장 선택 시트
  if(act==='openSitePicker'){openSitePicker(v);return}
  if(act==='siteFilter'){applySiteFilter(v);return}
  if(act==='pickSite'){pickSiteFromSheet(v);return}
  if(act==='closeSheet'){closeSiteSheet();return}

  // 현장 종료·활성화
  if(act==='closeSite'){var ms=MS(v);if(ms&&confirm(h(ms.name)+' 현장을 종료할까요?\n목록에서 숨겨지며, 설정에서 다시 활성화할 수 있습니다.')){ms.closed=true;save();render();toast('종료됨: '+ms.name)}return}
  if(act==='reopenSite'){var ms=MS(v);if(ms){ms.closed=false;save();render();toast('다시 활성: '+ms.name)}return}

  // 채팅 보내기
  if(act==='chatSend'){
    const msgEl=document.getElementById('chatMsg');
    const nameEl=document.getElementById('chatName');
    const txt=msgEl?msgEl.value.trim():'';
    if(!txt)return;
    const sh=SH(v);if(!sh)return;
    if(!sh.messages) sh.messages=[];
    const isShare=UI.role==='share';
    let senderName='',senderRole=UI.role;
    if(isShare){
      senderName=(nameEl?nameEl.value.trim():'')||'공유 링크 방문자';
      senderRole='share';
      UI.sel.shareName=senderName;
    } else if(UI.role==='orderer') senderName='화주(나)';
    else if(UI.role==='producer') senderName=(S.producers[0]||{}).name||'생산';
    else if(UI.role==='site') senderName=(S.sites[0]||{}).name||'현장(도착)';
    else if(UI.role==='driver') senderName=(S.drivers[0]||{}).name||'기사';
    else senderName=UI.role;
    sh.messages.push({role:senderRole,name:senderName,text:txt,time:new Date().toTimeString().slice(0,5)});
    save();render();
    requestAnimationFrame(()=>{const cl=document.getElementById('chatList');if(cl)cl.scrollTop=cl.scrollHeight});
    return;
  }
  // 생산자: 접수
  if(act==='accept'){const sh=SH(v);if(sh){sh.status='accepted';sh.acceptedAt=new Date().toISOString().slice(0,16).replace('T',' ');save();render();toast('접수 완료')}return}
  // 생산자: 상차 시작
  if(act==='startLoad'){const sh=SH(v);if(sh){sh.status='loading';sh.loadingAt=new Date().toISOString().slice(0,16).replace('T',' ');save();render();toast('상차 시작')}return}
  // 기사: 배차 수락 (도착 예정 시간 포함)
  if(act==='driverAccept'){const sh=SH(v);if(sh){
    var etaEl=document.getElementById('eta_'+v);
    sh.driver=S.drivers[0].id;sh.vehicleId=S.drivers[0].vehicleId;
    sh.status='accepted';sh.acceptedAt=new Date().toISOString().slice(0,16).replace('T',' ');
    if(etaEl&&etaEl.value) sh.eta=etaEl.value;
    save();render();toast('배차 수락'+(sh.eta?' · 도착 예정 '+sh.eta:''))}return}
  // 기사: 출발 → 알림 + 받는 사람에게 문자(추적 링크)
  if(act==='depart'){const sh=SH(v);if(sh){sh.status='departed';sh.departedAt=new Date().toISOString().slice(0,16).replace('T',' ');
    sh.gps=[{lat:37.34,lng:126.81,t:'now'}];save();render();
    var msg='출발했습니다.';
    if(sh.receiverPhone) msg+=' 받는 사람('+sh.receiverPhone+')에게 추적 링크 문자 전송 (시제품)';
    toast(msg)}return}
  // 기사: 도착
  if(act==='arrive'){const sh=SH(v);if(sh){sh.status='arrived';sh.arrivedAt=new Date().toISOString().slice(0,16).replace('T',' ');save();render();toast('도착')}return}
  // 기사: 하차
  if(act==='unload'){const sh=SH(v);if(sh){sh.status='unloaded';sh.unloadedAt=new Date().toISOString().slice(0,16).replace('T',' ');save();render();toast('하차 완료')}return}
  // 현장: 인수 확인
  if(act==='confirmRecv'){const sh=SH(v);if(sh){sh.signature='확인완료';sh.status='unloaded';save();render();toast('인수 확인')}return}
  // 운영자: 요금 저장
  if(act==='saveRates'){
    document.querySelectorAll('[data-key]').forEach(el=>{
      const k=el.dataset.key;
      if(k==='comm_val'){
        if(S.rates.commission_type==='percent') S.rates.commission_rate=Number(el.value);
        else S.rates.commission_fixed=Number(el.value);
      } else if(S.rates[k]!==undefined) S.rates[k]=Number(el.value)||el.value;
    });
    save();render();toast('저장 완료');return}
}

document.addEventListener('click',handleAction);
var _touchStart=null;
document.addEventListener('touchstart',function(e){
  if(e.touches.length===1) _touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
  else _touchStart=null;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!_touchStart)return;
  var ch=e.changedTouches[0];if(!ch)return;
  var dx=ch.clientX-_touchStart.x,dy=ch.clientY-_touchStart.y;
  if(dx*dx+dy*dy>20*20)return;
  handleAction(e);
});

    const sh={
      id:uid(),orderer:'화주(나)',
      fromSite:fd.get('fromSite'),toSite:fd.get('toSite'),
      producer:null,site:null,driver:null,
      vehicleId:fd.get('vehicleId'),
      loadTime:fd.get('loadTime')||'',unloadTime:fd.get('unloadTime')||'',
      cargoType:fd.get('cargoType')||'',approxKg:Number(fd.get('approxKg'))||0,
      items:[{name:fd.get('cargoType')||'물건',material:'-',qty:1,L:0,W:0,H:0,unitKg:Number(fd.get('approxKg'))||0}],
      status:'requested',requestedAt:new Date().toISOString().slice(0,16).replace('T',' '),
      acceptedAt:null,loadingAt:null,departedAt:null,arrivedAt:null,unloadedAt:null,settledAt:null,eta:null,
      fare:350000,fareNote:'가정값',payer:fd.get('payer'),shareToken:Math.random().toString(36).slice(2,8),
      receiverPhone:fd.get('receiverPhone')||'',
      gps:[],photos:{},signature:null,issue:null,messages:[]
    };
    S.shipments.push(sh);save();
    UI.tab.orderer='tracking';UI.sel.trackId=sh.id;
    render();toast('운송 요청 완료');
  }
  if(form.dataset.form==='saveProfile'){
    var fd=new FormData(form);
    ['name','phone','company','bizNo','email','addr','memo'].forEach(k=>{S.myProfile[k]=fd.get(k)||''});
    save();render();toast('화주 정보 저장됨');
  }
  if(form.dataset.form==='saveDriver'){
    var fd=new FormData(form);var me=S.drivers[0];
    me.name=fd.get('name')||me.name;me.phone=fd.get('phone')||me.phone;
    me.bizName=fd.get('bizName')||'';me.bizNo=fd.get('bizNo')||'';
    save();render();toast('기본 정보 저장됨');
  }
  if(form.dataset.form==='saveVehicle'){
    var fd=new FormData(form);var me=S.drivers[0];
    me.plateNo=fd.get('plateNo')||me.plateNo;me.vehicleId=fd.get('vehicleId')||me.vehicleId;
    me.actualL=Number(fd.get('actualL'))||me.actualL;me.actualW=Number(fd.get('actualW'))||me.actualW;
    me.actualH=Number(fd.get('actualH'))||me.actualH;
    save();render();toast('차량 정보 저장됨');
  }
});

/* 차량 선택 팝업 */
var _vehPopTmp=null;
function openVehPopup(){
  var bg=$('#vehPopupBg');if(!bg)return;
  var sel=$('#vehSel');if(!sel)return;
  var cur=UI.sel._selVeh||'';
  var opts='<option value="">차량을 선택하세요</option>';
  var groups={};S.vehicles.forEach(function(v){(groups[v.ton]=groups[v.ton]||[]).push(v)});
  Object.keys(groups).forEach(function(ton){
    opts+='<optgroup label="'+h(ton)+'">';
    groups[ton].forEach(function(v){opts+='<option value="'+v.id+'"'+(v.id===cur?' selected':'')+'>'+h(v.type)+' — '+h(v.name)+(v.confirmed?'':' (확인 필요)')+'</option>'});
    opts+='</optgroup>';
  });
  sel.innerHTML=opts;
  _vehPopTmp=cur;
  updateVehPopDetail(cur);
  bg.classList.add('open');
  sel.onchange=function(){_vehPopTmp=sel.value;updateVehPopDetail(sel.value)};
  $('#vehPopCancel').onclick=closeVehPopup;
  $('#vehPopOk').onclick=function(){
    var v=_vehPopTmp||'';
    UI.sel._selVeh=v;save();
    var hid=$('#vehHidden');if(hid)hid.value=v;
    closeVehPopup();
    render();
    setTimeout(function(){
      var form=document.querySelector('[data-form="newShip"]');
      var items=[{L:500,W:200,H:100,qty:1,unitKg:10}];
      if(form){var fd=new FormData(form);items=[{L:Number(fd.get('itemL'))||500,W:Number(fd.get('itemW'))||200,H:Number(fd.get('itemH'))||100,qty:Number(fd.get('qty'))||1,unitKg:Number(fd.get('unitKg'))||10}]}
      render3D('cargo3d',v,items);
    },60);
  };
}
function updateVehPopDetail(vid){
  var box=$('#vehPopDetail');if(!box)return;
  var v=V(vid);
  if(!v){box.innerHTML='';return}
  box.innerHTML='<div class="veh-detail"><b>'+h(v.name)+'</b><br>적재함 '+won(v.L)+' × '+won(v.W)+' × '+won(v.H)+' mm<br>최대적재량 '+won(v.maxKg)+' kg'+(v.confirmed?'':' · <span style="color:var(--warn)">확인 필요</span>')+(v.note?'<br>'+h(v.note):'')+'</div>';
}
function closeVehPopup(){var bg=$('#vehPopupBg');if(bg)bg.classList.remove('open')}

// 뒤로가기(popstate) 지원 — 역할을 바꿀 때 히스토리에 쌓음
var _skipPush=false;
function pushUI(){
  if(_skipPush){_skipPush=false;return}
  try{history.pushState({type:UI.type,role:UI.role},'');}catch(e){}
}
window.addEventListener('popstate',function(e){
  if(e.state&&e.state.role){
    UI.type=e.state.type;UI.role=e.state.role;
    _skipPush=true;render();
  } else {
    UI.type=null;UI.role='orderer';
    _skipPush=true;render();
  }
});
// 처음 상태 기록
try{history.replaceState({type:UI.type,role:UI.role},'');}catch(e){}

render();
</script>
